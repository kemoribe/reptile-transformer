[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homology-audit"
version = "1.2.0"
description = "Sequence-homology audit toolkit for target-disjoint DTA benchmarking (MMseqs2 wrapper, binding-spectrum mirror audit, degradation detection, benchmark format adapters, one-command audit-benchmark pipeline)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "target-disjoint-dta maintainers" }]
keywords = ["DTA", "drug-target affinity", "homology", "MMseqs2", "cold-start", "data leakage"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
tutorial = ["jupyter>=1.0"]

[project.scripts]
homology-audit = "homology_audit.cli:main"
audit-benchmark = "homology_audit.pipeline:main"

[tool.setuptools]
packages = ["homology_audit"]
